entries:
  - version: 0.1.4
    breaking: false
    title: SQL formatting, error modal copy, escaping connection/options pages
    changes:
      - "New: Format the query in the editor in place with `gf` (vim) or `Ctrl+f` (normal), also available from the actions modal"
      - "New: Error modal now has a button to copy the error text to the clipboard"
      - "Fix: Autocomplete for columns, schemas, and tables now behaves correctly when the cursor is inside quotes"
      - "Fix: Focus is restored correctly after a failed row delete"
      - "Fix: Exiting the connection or options page no longer wipes the active session"
  - version: 0.1.3
    breaking: false
    title: Views in schema tree, XLSX export, dialect-aware autocomplete, Windows support
    changes:
      - "New: Views now appear in the schema tree; opening a view shows its data and structure"
      - "New: XLSX export option added to the export modal"
      - "New: Autocomplete quotes identifiers using the correct syntax per backend (Postgres/SQLite: `\"`, MySQL: `` ` ``, SQL Server: `[]`)"
      - "New: Windows PowerShell install script; log path defaults to OS temp directory on all platforms"
      - "Fix: Opening a table or query that already has an open tab now focuses the existing tab instead of creating a duplicate"
      - "Fix: Copy as JSON now correctly formats nested JSON values"
  - version: 0.1.2
    breaking: false
    title: Copy row as JSON/CSV, longer key sequences, paste fix
    changes:
      - "New: Copy row as JSON or CSV — `yrj` / `yrc` in vim mode, `Alt+j` / `Alt+c` in normal mode; also available from the actions modal"
      - "New: Keybinding sequences now accept two or more runes, enabling chords like `yrj`"
      - "New: `--config` accepts a directory path and resolves to `config.yaml` inside it"
      - "Fix: Bracketed-paste input from the terminal now works correctly"
      - "Improvement: Confirm key defaults to `Ctrl+s` in both modes (was `Ctrl+Enter` in normal mode, which doesn't register in some terminals)"
